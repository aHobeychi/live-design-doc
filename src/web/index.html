<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>livedoc</title>
<style>
  :root {
    /* ---- ink & paper ---- */
    --ink: #1c1b18;
    --ink-soft: #423f39;
    --paper: #fdfdfc;
    --paper-2: #f5f4f0;       /* recessed fills: code, table zebra, hover */
    --hairline: #e4e2db;      /* the default rule */
    --hairline-strong: #cbc8bf;
    --chrome: #57544c;        /* mono chrome text — AA on paper (~6:1) */
    --chrome-soft: #807c73;   /* decorative/large-only chrome */
    /* ---- semantic signals (only these carry color) ---- */
    --accent: #0a5c36;   --accent-tint: #ebf2ed;   /* agent / approved / suggestion */
    --warn:   #855000;   --warn-tint:   #f5eee2;   /* moved / edited */
    --danger: #9e1c1c;   --danger-tint: #f6eaea;   /* blocker / orphan */
    --info:   #234f8c;   --info-tint:   #eaeff6;   /* question */
    --target: #f3eddd;   /* the block a note points at (warm reading tint) */
    --flash:  #fbf0cd;   /* one-shot change reveal */
    /* ---- shared surface language ---- */
    --radius: 3px;
    --radius-lg: 5px;
    --shadow: 0 1px 2px rgba(24, 22, 18, 0.05), 0 8px 24px -8px rgba(24, 22, 18, 0.18);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", ui-serif, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
  ::selection { background: #d9e5dd; }
  /* ---- chrome: monospace, uppercase, hairline rules ---- */
  header, footer {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--chrome);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 11px 24px;
  }
  header {
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(6px);
    z-index: 15;
  }
  footer {
    border-top: 1px solid var(--hairline);
    position: sticky;
    bottom: 0;
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter: saturate(1.4) blur(6px);
  }
  .brand { color: var(--ink); font-weight: 700; letter-spacing: 0.04em; }
  #file { color: var(--chrome); }
  #rev { color: var(--chrome-soft); font-variant-numeric: tabular-nums; }
  #progress-count { color: var(--accent); font-variant-numeric: tabular-nums; }
  /* status chip — one calm pill; color earned only at the meaningful states */
  #status-chip {
    border: 1px solid var(--hairline-strong);
    color: var(--chrome);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 10px;
    line-height: 1.4;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #status-chip::before {
    content: "";
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
    opacity: 0.85;
  }
  #status-chip[data-status="clarifying"] { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, var(--hairline)); }
  #status-chip[data-status="drafting"] { color: var(--chrome); }
  #status-chip[data-status="drafting"]::before { animation: pulse 1.6s ease-in-out infinite; }
  #status-chip[data-status="review"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--hairline)); }
  #status-chip[data-status="approved"],
  #status-chip[data-status="executing"],
  #status-chip[data-status="done"] {
    color: var(--paper); background: var(--accent); border-color: var(--accent);
  }
  #status-chip[data-status="executing"]::before { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .spacer { flex: 1; }
  button {
    font: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    background: none;
    border: 1px solid var(--hairline-strong);
    color: var(--ink);
    padding: 5px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
  /* Approve — the one consequential act; carries accent weight */
  #approve.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 5px 18px;
    box-shadow: 0 1px 0 rgba(24, 22, 18, 0.04);
  }
  #approve.primary:hover {
    background: color-mix(in srgb, var(--accent) 88%, #000);
    border-color: color-mix(in srgb, var(--accent) 88%, #000);
    box-shadow: 0 2px 10px -3px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  #send { color: var(--chrome); border-color: var(--hairline-strong); }
  #send:not(:disabled) { color: var(--ink); }
  /* ---- layout: 640px manuscript column + right margin ---- */
  main { flex: 1; }
  #layout {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 44px;
    padding: 56px 24px 140px;
  }
  #doc { width: 640px; max-width: 100%; font-size: 17.5px; line-height: 1.72; hanging-punctuation: first; }
  #doc :is(p, ul, ol) { text-wrap: pretty; }
  #margin { position: relative; width: 264px; flex-shrink: 0; }
  /* ---- table of contents (wide screens only) ---- */
  #toc {
    position: sticky;
    top: 76px;
    align-self: flex-start;
    width: 210px;
    flex-shrink: 0;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }
  #toc .toc-title {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--chrome-soft);
    padding: 2px 12px 9px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 8px;
  }
  #toc a {
    display: block;
    color: var(--chrome);
    text-decoration: none;
    padding: 3px 12px;
    border-left: 2px solid transparent;
    margin-left: -2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  #toc a:hover { color: var(--ink); }
  #toc a.active { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
  #toc a[data-level="2"] { padding-left: 24px; }
  #toc a[data-level="3"] { padding-left: 36px; }
  @media (max-width: 1339px) { #toc { display: none; } }
  #leaders {
    position: absolute;
    pointer-events: none;
    overflow: visible;
    top: 0; left: 0;
  }
  /* ---- document blocks ---- */
  .block { margin: 0 0 1.05em; padding: 3px 7px; margin-left: -7px; border-radius: var(--radius); }
  .block.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
  .block.note-target { background: var(--target); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 22%, transparent); }
  #doc p.block { margin-bottom: 1.05em; }
  h1.block { font-size: 32px; line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 0.5em; padding-bottom: 0.35em; border-bottom: 1px solid var(--hairline); }
  h2.block { font-size: 23px; line-height: 1.25; letter-spacing: -0.008em; margin: 1.6em 0 0.5em; }
  h3.block, h4.block { font-size: 18.5px; line-height: 1.3; margin: 1.5em 0 0.4em; }
  h4.block { font-size: 16px; color: var(--ink-soft); }
  /* first heading shouldn't push a big top margin */
  #doc > .block:first-child { margin-top: 0; }
  .block.code { margin: 0 0 1.05em; }
  .block.code pre {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    background: var(--paper-2);
    border: 1px solid var(--hairline);
    padding: 13px 16px;
    overflow-x: auto;
    border-radius: var(--radius);
    tab-size: 2;
  }
  .block code { font-family: var(--mono); font-size: 0.84em; background: var(--paper-2); padding: 1px 5px; border-radius: var(--radius); border: 1px solid var(--hairline); }
  .block.code pre code { background: none; padding: 0; border: none; font-size: inherit; }
  /* mockups — dashed border reads as "sketch, not code" */
  .block.code { position: relative; }
  .block.code pre.mockup { background: var(--paper); border: 1px dashed var(--hairline-strong); line-height: 1.35; }
  .block.code .mock-note {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 1;
    opacity: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 8px;
  }
  .block.code:hover .mock-note, .block.code .mock-note:focus-visible { opacity: 1; }
  .block.code iframe.mockup {
    display: block;
    width: 100%;
    border: 1px dashed var(--hairline-strong);
    border-radius: var(--radius);
    background: var(--paper);
  }
  blockquote.block { border-left: 3px solid var(--hairline-strong); padding: 2px 0 2px 16px; margin-left: -3px; color: var(--ink-soft); font-style: italic; }
  /* tables — print-galley: horizontal rules only, no cage */
  table { border-collapse: collapse; font-size: 15px; width: 100%; margin: 0 0 1.05em; }
  th, td { padding: 7px 12px 7px 0; text-align: left; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  tr td:last-child, tr th:last-child { padding-right: 0; }
  th {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chrome);
    border-bottom: 1.5px solid var(--hairline-strong);
    font-weight: 600;
  }
  tbody tr:last-child td, table tr:last-child td { border-bottom: none; }
  /* consecutive list items read as one list */
  .block.listItem { display: flex; gap: 12px; margin-bottom: 0.3em; padding-top: 2px; padding-bottom: 2px; }
  .block.listItem + .block.listItem { margin-top: 0; }
  .block.listItem:has(+ .block:not(.listItem)), .block.listItem:last-child { margin-bottom: 1.05em; }
  .li-marker { color: var(--chrome-soft); flex-shrink: 0; min-width: 16px; text-align: right; font-variant-numeric: tabular-nums; font-size: 0.94em; line-height: 1.72; }
  .li-body { flex: 1; }
  .li-sub { color: var(--ink-soft); font-size: 15.5px; line-height: 1.6; margin-top: 3px; }
  .tick {
    display: inline-flex; width: 15px; height: 15px;
    border: 1.5px solid var(--chrome-soft); border-radius: var(--radius);
    margin-right: 9px; vertical-align: -2px; position: relative;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .block.done .tick, .tick[data-state="done"] { border-color: var(--accent); background: var(--accent); }
  .block.done .tick::after, .tick[data-state="done"]::after {
    content: ""; position: absolute; left: 4px; top: 1px;
    width: 4px; height: 8px; border: solid var(--paper);
    border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .block.done .li-body { color: var(--chrome); }
  .block.done .li-body > .fileref { opacity: 0.7; }
  /* ---- margin notes ---- */
  .note {
    position: absolute;
    width: 100%;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    border: 1px solid var(--hairline);
    border-left: 2.5px solid var(--chrome-soft);
    background: var(--paper);
    padding: 9px 11px;
    border-radius: var(--radius);
    transition: top 0.24s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .note:hover { border-color: var(--hairline-strong); box-shadow: 0 2px 10px -6px rgba(24, 22, 18, 0.3); }
  .note[data-state="new"] { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-tint) 55%, var(--paper)); }
  .note .quote {
    color: var(--chrome);
    font-style: italic;
    font-family: var(--serif);
    font-size: 12.5px;
    display: block;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note .body { color: var(--ink); }
  .note .badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 1px 6px;
    border-radius: 999px;
    margin-bottom: 6px;
    margin-right: 4px;
    border: 1px solid currentColor;
  }
  .note .badge.moved, .note .badge.approximate { color: var(--warn); background: var(--warn-tint); }
  .note .badge.orphan { color: var(--danger); background: var(--danger-tint); }
  .note .del, .note .edit {
    float: right; border: none; padding: 0 3px; color: var(--chrome-soft); font-size: 13px; line-height: 1;
    transition: color 0.12s ease;
  }
  .note .del:hover { color: var(--danger); }
  .note .edit:hover { color: var(--accent); }
  .note .edit-ta {
    width: 100%; font: inherit; border: 1px solid var(--hairline-strong);
    border-radius: var(--radius);
    padding: 7px; resize: vertical; min-height: 54px; margin-bottom: 6px;
    background: var(--paper); color: var(--ink);
  }
  .note .edit-ta:focus { outline: none; border-color: var(--accent); }
  .note .edit-row { display: flex; gap: 6px; justify-content: flex-end; }
  .note .edit-row button { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 10px; }
  .leader { fill: none; stroke: var(--hairline-strong); stroke-width: 1; }
  /* ---- selection → add note ---- */
  #addnote {
    position: absolute;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 6px 13px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 10;
  }
  #addnote:hover { background: var(--accent); }
  /* ---- floating surfaces: shared border / radius / shadow ---- */
  #composer {
    position: fixed;
    right: 24px;
    bottom: 74px;
    width: 328px;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 16px;
    z-index: 20;
    font-family: var(--mono);
    font-size: 12px;
  }
  #composer blockquote {
    font-family: var(--serif);
    font-style: italic;
    color: var(--chrome);
    border-left: 2px solid var(--hairline-strong);
    padding-left: 11px;
    margin-bottom: 12px;
    max-height: 60px;
    overflow: hidden;
    line-height: 1.5;
  }
  #composer textarea {
    width: 100%;
    height: 84px;
    font: inherit;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius);
    padding: 9px;
    resize: vertical;
    margin-bottom: 10px;
    background: var(--paper);
    color: var(--ink);
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer .row { display: flex; gap: 8px; justify-content: flex-end; }
  /* ---- clarify phase ---- */
  #clarify { max-width: 620px; margin: 56px auto; padding: 0 24px 140px; }
  #clarify h1 { font-size: 27px; letter-spacing: -0.01em; margin-bottom: 8px; }
  #clarify .sub { color: var(--chrome); font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 36px; }
  .question { border-top: 1px solid var(--hairline); padding: 22px 0; }
  .question .prompt { font-size: 18px; line-height: 1.5; margin-bottom: 14px; }
  .question label {
    display: block;
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 11px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    margin-bottom: 7px;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .question label:hover { border-color: var(--chrome-soft); }
  .question label:has(:checked) { border-color: var(--accent); background: var(--accent-tint); }
  .question input[type="radio"], .question input[type="checkbox"] { margin-right: 9px; accent-color: var(--accent); }
  .question input[type="text"] {
    width: 100%; font: inherit; font-family: var(--mono); font-size: 13px;
    border: 1px solid var(--hairline-strong); padding: 9px; border-radius: var(--radius);
    background: var(--paper); color: var(--ink);
  }
  .question input[type="text"]:focus { outline: none; border-color: var(--accent); }
  #clarify .actions { display: flex; gap: 10px; margin-top: 32px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  /* ---- empty / waiting states ---- */
  .empty {
    text-align: center;
    color: var(--chrome-soft);
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 140px 24px;
    line-height: 2;
  }
  .empty::before {
    content: "";
    display: block;
    width: 26px; height: 1px;
    background: var(--hairline-strong);
    margin: 0 auto 22px;
  }
  #banner {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.03em;
    text-align: center;
    padding: 11px;
    background: var(--accent-tint);
    color: var(--accent);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, var(--hairline));
  }
  /* ---- dialog & toast (replacing browser confirm/alert) ---- */
  dialog {
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    background: var(--paper);
    color: var(--ink);
    padding: 0;
    width: 400px;
    max-width: calc(100vw - 48px);
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(20, 20, 18, 0.32); backdrop-filter: blur(1px); }
  dialog[open] { animation: dialog-in 0.16s ease-out; }
  @keyframes dialog-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  #dialog-title {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--chrome);
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
  }
  #dialog-body {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.6;
    padding: 18px 20px;
  }
  #dialog .row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 0 20px 18px;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 66px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    padding: 10px 17px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 30;
    max-width: min(480px, calc(100vw - 48px));
    animation: toast-in 0.16s ease-out;
  }
  #toast.error { background: var(--danger); }
  @keyframes toast-in { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  /* ---- intents & suggestions ---- */
  button.linkish {
    border: none;
    padding: 0;
    color: var(--chrome);
    background: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--hairline-strong);
    font-size: inherit;
    border-radius: 0;
  }
  button.linkish:hover { color: var(--ink); text-decoration-color: currentColor; }
  .intent-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .intent-chip {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border: 1px solid var(--hairline-strong);
    color: var(--chrome);
    border-radius: 999px;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .intent-chip.active[data-intent="blocker"] { color: var(--danger); border-color: var(--danger); background: var(--danger-tint); }
  .intent-chip.active[data-intent="change"] { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
  .intent-chip.active[data-intent="question"] { color: var(--info); border-color: var(--info); background: var(--info-tint); }
  .intent-chip.active[data-intent="nit"] { color: var(--ink); border-color: var(--ink); background: var(--paper-2); }
  /* intent-tinted left rule on the note itself, so the margin scans by intent */
  .note:has(.badge.intent-blocker) { border-left-color: var(--danger); }
  .note:has(.badge.intent-question) { border-left-color: var(--info); }
  .note:has(.badge.intent-nit) { border-left-color: var(--chrome-soft); }
  .note .badge.intent-blocker { color: var(--danger); background: var(--danger-tint); }
  .note .badge.intent-change { color: var(--accent); background: var(--accent-tint); }
  .note .badge.intent-question { color: var(--info); background: var(--info-tint); }
  .note .badge.intent-nit { color: var(--chrome); background: var(--paper-2); }
  .note .suggestion {
    margin-top: 8px;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--hairline));
    border-left: 2px solid var(--accent);
    background: var(--accent-tint);
    padding: 6px 9px;
    border-radius: var(--radius);
  }
  .note .suggestion .label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--accent);
    margin-bottom: 3px;
  }
  #composer .linkish { display: block; margin: 8px 0; font-size: 11px; }
  #composer #composer-suggestion { height: 56px; }
  /* ---- history ---- */
  #history-panel {
    position: fixed;
    top: 44px;
    right: 24px;
    z-index: 25;
    width: 300px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    font-family: var(--mono);
    font-size: 12px;
    box-shadow: var(--shadow);
  }
  .hist-rev {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 10px 14px;
    font-size: 12px;
  }
  .hist-rev:last-child { border-bottom: none; }
  .hist-rev:hover { background: var(--paper-2); }
  .hist-rev .meta { color: var(--chrome); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  #banner button.linkish { margin-left: 10px; color: inherit; text-decoration-color: currentColor; }
  body.history-mode #doc { opacity: 0.92; }
  /* ---- gentle diff: blocks the last push touched ---- */
  .block[data-revtag] { position: relative; box-shadow: inset 2.5px 0 0 var(--warn); }
  .block[data-revtag="new"] { box-shadow: inset 2.5px 0 0 var(--accent); }
  .block[data-revtag]::after {
    content: attr(data-revtag);
    position: absolute;
    top: 3px;
    right: 5px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warn);
    background: var(--warn-tint);
    padding: 0 4px;
    border-radius: 999px;
    opacity: 0.9;
  }
  .block[data-revtag="new"]::after { color: var(--accent); background: var(--accent-tint); }
  .note .compare { display: block; margin-top: 7px; font-size: 10px; }
  .beforeafter .ba-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chrome);
    font-family: var(--mono);
    margin: 12px 0 5px;
  }
  .beforeafter .ba-text {
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.55;
    border-left: 2px solid var(--hairline-strong);
    padding: 5px 12px;
    white-space: pre-wrap;
  }
  .beforeafter .ba-text.after { border-left-color: var(--accent); background: var(--accent-tint); }
  /* ---- build evidence under ticked tasks ---- */
  .evidence {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--chrome);
    margin-top: 4px;
    line-height: 1.65;
    padding-left: 2px;
  }
  .evidence::before { content: "└ "; color: var(--accent); }
  /* ---- @file hover preview ---- */
  #preview {
    position: fixed;
    z-index: 50;
    width: min(480px, calc(100vw - 48px));
    max-height: 300px;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    pointer-events: none;
  }
  #preview .pv-head {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chrome);
    padding: 7px 11px;
    border-bottom: 1px solid var(--hairline);
  }
  #preview pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.55;
    padding: 9px 11px;
    max-height: 260px;
    overflow: hidden;
    white-space: pre;
  }
  .fileref { cursor: help; }
  /* ---- @file mention autocomplete ---- */
  #mention {
    position: fixed;
    z-index: 40;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 12px;
    max-height: 200px;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .mention-item {
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl; /* long paths keep their filename end visible */
    text-align: left;
  }
  .mention-item.active { background: var(--ink); color: var(--paper); }
  .fileref {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--accent-tint);
    color: var(--accent);
    padding: 0 4px;
    border-radius: var(--radius);
  }
  [hidden] { display: none !important; }
  /* ---- narrow: margin collapses, notes stack under the document ---- */
  @media (max-width: 1040px) {
    #layout { flex-direction: column; align-items: center; gap: 32px; }
    #margin { width: 640px; max-width: 100%; }
    #leaders { display: none; }
    .note { position: static; margin-bottom: 10px; }
  }
  /* ---- dark mode: same semantic variables, re-toned ---- */
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece9e2;
      --ink-soft: #b7b3aa;
      --paper: #17160f;
      --paper-2: #23211a;
      --hairline: #322f27;
      --hairline-strong: #47433a;
      --chrome: #a8a49a;
      --chrome-soft: #7c7970;
      --accent: #63c08d;   --accent-tint: #17251c;
      --warn:   #d99e4c;   --warn-tint:   #26200f;
      --danger: #e07b7b;   --danger-tint: #271515;
      --info:   #7ba7e0;   --info-tint:   #141d2b;
      --target: #2a2413;
      --flash:  #33300f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px -10px rgba(0, 0, 0, 0.7);
    }
    ::selection { background: #2a4034; }
    #approve.primary { color: #10130f; }
    button.primary { color: var(--paper); }
    .mention-item.active { color: var(--paper); }
    #status-chip[data-status="approved"],
    #status-chip[data-status="executing"],
    #status-chip[data-status="done"] { color: #10130f; }
    #addnote { color: var(--paper); }
    #toast { color: var(--paper); }
  }
</style>
</head>
<body>
  <header>
    <span class="brand">livedoc</span>
    <span id="file"></span>
    <span class="spacer"></span>
    <span id="progress-count" hidden></span>
    <button id="history-btn" class="linkish">history</button>
    <span id="rev"></span>
    <span id="status-chip"></span>
  </header>
  <div id="history-panel" hidden></div>
  <div id="banner" hidden></div>
  <main>
    <section id="clarify" hidden></section>
    <div id="layout" hidden>
      <nav id="toc" aria-label="Table of contents"></nav>
      <article id="doc"></article>
      <aside id="margin">
        <svg id="leaders"></svg>
        <div id="notes"></div>
      </aside>
    </div>
    <div id="waiting" class="empty" hidden></div>
  </main>
  <footer id="bar">
    <span id="hint">Select text to add a note</span>
    <span class="spacer"></span>
    <span id="unsent"></span>
    <button id="send">Send</button>
    <button id="approve" class="primary">Approve</button>
  </footer>
  <button id="addnote" hidden>Add note</button>
  <div id="composer" hidden>
    <blockquote id="composer-quote"></blockquote>
    <div id="composer-intent" class="intent-row">
      <button class="intent-chip" data-intent="blocker">blocker</button>
      <button class="intent-chip active" data-intent="change">change</button>
      <button class="intent-chip" data-intent="question">question</button>
      <button class="intent-chip" data-intent="nit">nit</button>
    </div>
    <textarea id="composer-text" placeholder="Your note…"></textarea>
    <button id="composer-suggest" class="linkish">+ suggest wording</button>
    <textarea id="composer-suggestion" hidden placeholder="Proposed wording for the quoted text…"></textarea>
    <div class="row">
      <button id="composer-cancel">Cancel</button>
      <button id="composer-save" class="primary">Save note</button>
    </div>
  </div>
  <dialog id="dialog">
    <div id="dialog-title"></div>
    <div id="dialog-body"></div>
    <div class="row">
      <button id="dialog-cancel">Cancel</button>
      <button id="dialog-ok" class="primary">OK</button>
    </div>
  </dialog>
  <div id="toast" hidden></div>
  <div id="mention" hidden></div>
  <div id="preview" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
